<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Strait of Hormuz | Glenn Hurley</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      /* chunkier, more legible monospace than Courier on phones; Courier as fallback */
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace;
      --navy: #0d1f2d;
      --navy-deep: #0a1828;
      --cyan: #5bc0f8;
      --cyan-hi: #7fd3ff;
      --text: #e0e8f0;
      --text-dim: #a9c2d8;
      --line: #2c4c68;
      --yellow: #ffd54a;
      --red: #ff7a7a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--mono);
      touch-action: none;
      user-select: none;
    }

    #c { display: block; }

    .panel {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 10, 20, 0.88);
      z-index: 10;
    }
    .panel.hidden { display: none; }

    /* ── Retro terminal card (start screen + leaderboard) ── */
    .card {
      position: relative;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
        var(--navy);
      border: 3px solid var(--cyan);
      border-radius: 0;
      box-shadow:
        inset 0 0 0 3px var(--navy),
        inset 0 0 0 5px var(--line),
        8px 8px 0 #000;
      padding: 24px 20px 20px;
      width: min(380px, 92vw);
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      touch-action: pan-y; /* body is touch-action: none; let the card scroll on short screens */
      color: var(--text);
      text-align: center;
    }

    .card h1 {
      font-size: 1.75rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--cyan-hi);
      text-shadow: 3px 3px 0 #000, 0 0 12px rgba(91, 192, 248, 0.45);
      margin-bottom: 8px;
    }
    .tagline {
      font-size: min(0.85rem, 3.3vw);
      white-space: nowrap;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      text-align: left;
      font-size: 0.8rem;
      font-weight: bold;
      color: #c9dcee;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .field-label::before { content: '▸ '; color: var(--cyan); }

    .flag-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .flag-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--navy-deep);
      border: 2px solid var(--line);
      border-radius: 0;
      padding: 10px 12px;
      cursor: pointer;
      color: var(--text);
      transition: border-color .12s, background .12s;
      font-family: inherit;
    }
    .flag-opt:hover { border-color: #4a7ca6; }
    .flag-opt:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
    .flag-opt .flag-em { font-size: 2rem; line-height: 1; flex: none; }
    .flag-opt .flag-text { flex: 1; min-width: 0; }
    .flag-opt .flag-name {
      display: block;
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #f0f6fc;
    }
    .flag-opt .flag-note { display: block; font-size: 0.8rem; color: var(--text-dim); margin-top: 3px; }
    .flag-opt .flag-check {
      flex: none;
      width: 22px;
      height: 22px;
      border: 2px solid #4a6a88;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: transparent;
    }
    .flag-opt.sel { border-color: var(--cyan); background: #12304d; box-shadow: 4px 4px 0 #000; }
    .flag-opt.sel .flag-check { background: var(--cyan); border-color: var(--cyan); color: #04121f; }

    #tanker-name {
      width: 100%;
      background: var(--navy-deep);
      border: 2px solid var(--line);
      border-radius: 0;
      padding: 12px;
      color: #f0f6fc;
      font-family: inherit;
      font-size: 1rem; /* 16px+ stops iOS zooming in on focus */
      font-weight: bold;
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 20px;
      outline: none;
      transition: border-color .12s;
    }
    #tanker-name:focus { border-color: var(--cyan); }
    #tanker-name::placeholder { color: #7f98b0; font-weight: normal; }

    /* chunky arcade button with a hard shadow that "presses" in */
    .btn-primary {
      width: 100%;
      background: var(--yellow);
      border: 3px solid #000;
      border-radius: 0;
      padding: 13px;
      color: #1a1300;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: transform .06s, box-shadow .06s, background .12s;
    }
    .btn-primary:hover { background: #ffe07a; }
    .btn-primary:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #000; }
    .btn-primary:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .controls-hint {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 16px;
      line-height: 1.5;
    }
    .version {
      margin-top: 12px;
      font-size: 0.7rem;
      color: #7f98b0;
      letter-spacing: 0.08em;
    }
    .controls-hint kbd {
      font-family: inherit;
      font-size: 0.75rem;
      color: var(--text);
      background: #1a3248;
      border: 1px solid #36597a;
      box-shadow: 1px 1px 0 #000;
      padding: 0 5px;
    }

    /* ── On-screen steering buttons (touch devices) ──── */
    #touch-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      display: flex;
      justify-content: space-between;
      padding: 0 18px;
      pointer-events: none;
      z-index: 5;            /* under the menu panels */
    }
    #touch-controls.hidden { display: none; }
    .steer-btn {
      pointer-events: auto;
      width: 84px;
      height: 84px;
      background: rgba(13, 31, 45, 0.55);
      border: 3px solid rgba(91, 192, 248, 0.85);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.7);
      color: #7fd3ff;
      font-size: 2rem;
      line-height: 1;
      font-family: inherit;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .steer-btn.pressed {
      background: rgba(91, 192, 248, 0.85);
      color: #04121f;
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 #000;
    }

    /* ── Leaderboard ───────────────────────────────────── */
    .death-msg {
      font-size: 0.9rem;
      font-weight: bold;
      line-height: 1.5;
      color: var(--red);
      text-align: left;
      border: 2px solid var(--red);
      background: rgba(255, 90, 90, 0.08);
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .death-msg:empty { display: none; }
    .death-msg::before { content: '☠ '; }

    .run-stats {
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 18px;
    }
    .run-stats b { color: #f0f6fc; font-size: 1rem; }

    .lb-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--cyan-hi);
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.8rem;
      margin-bottom: 20px;
      text-align: left;
    }
    .lb-table th {
      color: var(--text-dim);
      font-weight: bold;
      padding: 5px 4px;
      border-bottom: 2px solid var(--line);
      letter-spacing: 0.04em;
    }
    .lb-table td {
      padding: 6px 4px;
      color: #d4e3f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-table th:nth-child(1) { width: 2em; }
    .lb-table th:nth-child(3) { width: 3.2em; }
    .lb-table th:nth-child(4) { width: 3.6em; }
    .lb-table th:nth-child(5) { width: 4.6em; }
    .lb-table tr:nth-child(even) td { background: rgba(255,255,255,0.04); }
    .lb-table tr.you td { color: var(--yellow); font-weight: bold; background: rgba(255, 213, 74, 0.1); }

    /* ── Boss radio transmission ───────────────────────── */
    #dialog-panel {
      background: transparent;
      pointer-events: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 5vh;
    }
    #dialog-panel .radio { pointer-events: auto; }

    .radio {
      width: min(320px, 86vw);
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px),
        #1a1405;
      border: 3px solid var(--yellow);
      box-shadow: inset 0 0 0 3px #1a1405, inset 0 0 0 5px #6b5617, 8px 8px 0 #000;
      color: #fff3c4;
      animation: radio-in .25s steps(4);
    }
    @keyframes radio-in {
      from { transform: scaleY(0.05); opacity: 0.3; }
      to   { transform: scaleY(1);    opacity: 1; }
    }

    .radio-head {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--yellow);
      color: #1a1300;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .radio-dot {
      width: 9px;
      height: 9px;
      background: #d42020;
      flex: none;
      animation: blink 0.8s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .radio-from {
      padding: 12px 14px 0;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 0.06em;
      color: var(--yellow);
    }
    .radio-msg {
      padding: 8px 14px 4px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .radio-msg b { color: #fff; }
    .radio-msg::after {
      content: '█';
      margin-left: 2px;
      animation: blink 0.8s steps(1) infinite;
    }

    .radio-btn {
      display: block;
      margin: 14px auto 16px;
      background: var(--yellow);
      border: 3px solid #000;
      padding: 8px 34px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #1a1300;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: transform .06s, box-shadow .06s;
    }
    .radio-btn:hover { background: #ffe07a; }
    .radio-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #000; }
  </style>
</head>
<body>

<div class="panel" id="start-panel">
  <div class="card">
    <h1>STRAIT OF HORMUZ</h1>
    <p class="tagline">The world's most contested chokepoint.</p>

    <span class="field-label" id="flag-label">Choose your flag of convenience</span>
    <div class="flag-row" id="flag-row" role="radiogroup" aria-labelledby="flag-label">
      <button type="button" class="flag-opt sel" data-idx="0" role="radio" aria-checked="true">
        <span class="flag-em" aria-hidden="true">🇲🇳</span>
        <span class="flag-text">
          <span class="flag-name">Mongolia</span>
          <span class="flag-note">Landlocked since forever.</span>
        </span>
        <span class="flag-check" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="flag-opt" data-idx="1" role="radio" aria-checked="false">
        <span class="flag-em" aria-hidden="true">🇲🇭</span>
        <span class="flag-text">
          <span class="flag-name">Marshall Islands</span>
          <span class="flag-note">Currently sinking.</span>
        </span>
        <span class="flag-check" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="flag-opt" data-idx="2" role="radio" aria-checked="false">
        <span class="flag-em" aria-hidden="true">🇹🇻</span>
        <span class="flag-text">
          <span class="flag-name">Tuvalu</span>
          <span class="flag-note">Pop. 11,000. Mostly fish.</span>
        </span>
        <span class="flag-check" aria-hidden="true">✓</span>
      </button>
    </div>

    <label class="field-label" for="tanker-name">Name your tanker</label>
    <input type="text" id="tanker-name" placeholder="MV CRUDE JUSTICE" maxlength="22"
           autocomplete="off" spellcheck="false" autocapitalize="characters" />
    <button class="btn-primary" id="deploy-btn">⚓ DEPLOY</button>
    <p class="controls-hint" id="controls-hint">Steer by tapping the left or right side of the screen, or use <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd>.</p>
    <p class="version" id="version"></p>
  </div>
</div>

<div class="panel hidden" id="lb-panel">
  <div class="card">
    <div class="death-msg" id="death-msg"></div>
    <div class="run-stats">
      <span>DISTANCE <b id="run-nm">0</b> NM</span>
      <span>HULL DMG <b id="run-dmg">0</b>%</span>
    </div>
    <div class="lb-title">HALL OF FALLEN TANKERS</div>
    <table class="lb-table">
      <thead><tr><th>#</th><th>TANKER</th><th>NM</th><th>DMG</th><th>DATE</th></tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
    <button class="btn-primary" id="replay-btn">⚓ REDEPLOY</button>
  </div>
</div>

<div class="panel hidden" id="dialog-panel">
  <div class="radio" role="alertdialog" aria-labelledby="radio-head" aria-describedby="dialog-msg">
    <div class="radio-head" id="radio-head"><span class="radio-dot"></span>INCOMING TRANSMISSION</div>
    <div class="radio-from">FROM: USS MANIFEST DESTINY</div>
    <div class="radio-msg" id="dialog-msg"></div>
    <button class="radio-btn" id="dialog-ok">AYE!</button>
  </div>
</div>

<canvas id="c"></canvas>

<div id="touch-controls" class="hidden" aria-hidden="true">
  <button class="steer-btn" id="steer-left"  tabindex="-1">◀</button>
  <button class="steer-btn" id="steer-right" tabindex="-1">▶</button>
</div>

<script>
'use strict';

// ── canvas / scaling ────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
// Bump on every change so it's obvious on a phone whether a fresh copy loaded.
const VERSION = 'v1.7';
const LW = 400, LH = 720;
const MONO = "ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace";

function fitCanvas() {
  const s = Math.min(window.innerWidth / LW, window.innerHeight / LH);
  // render at the screen's real pixel density so text and ships stay sharp;
  // all drawing code keeps using the 400x720 logical coordinate space
  const k = s * (window.devicePixelRatio || 1);
  canvas.width  = Math.round(LW * k);
  canvas.height = Math.round(LH * k);
  canvas.style.width  = Math.floor(LW * s) + 'px';
  canvas.style.height = Math.floor(LH * s) + 'px';
  ctx.setTransform(k, 0, 0, k, 0, 0);
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ── constants ───────────────────────────────────────────────────
const SHORE_W   = 46;
const WATER_L   = SHORE_W;
const WATER_R   = LW - SHORE_W;
const WATER_W   = WATER_R - WATER_L;
const TW = 36, TH = 80;
const PLAYER_Y  = LH * 0.72;
const PLAYER_SPD = 230;
const BASE_SCROLL = 110;
const MAX_SCROLL  = 310;
const SCROLL_ACCEL = 5;
const NM_PX = 180;
const FINISH_NM = 100;          // strait length — game ends here
const HIT_INVUL = 1.0;          // seconds of invulnerability after a non-fatal hit

// damage per obstacle type (out of 100)
const DMG = {
  mine:    100,   // contact mine = ship-killer
  missile:  35,
  drone:    25,
  boat:     12,   // ramming damage from a fast boat
  rpg:      14,   // RPG round fired by a fast boat
};

// ── flags ───────────────────────────────────────────────────────
const FLAGS = [
  { emoji: '🇲🇳', name: 'Mongolia' },
  { emoji: '🇲🇭', name: 'Marshall Islands' },
  { emoji: '🇹🇻', name: 'Tuvalu' },
];

// ── game state ──────────────────────────────────────────────────
let state        = 'idle';
let scrollSpeed  = BASE_SCROLL;
let scrollY      = 0;
let distance     = 0;
let selectedFlag = 0;
let tankerName   = 'MV CRUDE JUSTICE';
let deathReason  = '';
let dyingTimer   = 0;
let eatenTimer   = 0;
let leaderboardShown = false;

let player    = { x: LW / 2, y: PLAYER_Y };
let obstacles = [];
let particles = [];
let bullets   = [];
let spawnClock    = 0;
let spawnInterval = 1.8;
let boss          = null;
let bossSpawned   = false;
let bossTarget    = FINISH_NM;
let damage        = 0;
let invulTimer    = 0;
let hitFlash      = 0;

// ── input ───────────────────────────────────────────────────────
const keys   = { left: false, right: false };
const touch  = { left: false, right: false };
const btns   = { left: false, right: false };   // on-screen arrow buttons

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left  = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

function touchSide(clientX) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width * LW;
  return x < LW / 2 ? 'left' : 'right';
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touch[touchSide(t.clientX)] = true;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touch.left = touch.right = false;
  for (const t of e.touches) touch[touchSide(t.clientX)] = true;
}, { passive: false });

canvas.addEventListener('touchcancel', () => { touch.left = touch.right = false; });

canvas.addEventListener('mousedown', e => { touch[touchSide(e.clientX)] = true; });
window.addEventListener('mouseup',   () => { touch.left = touch.right = false; });

// ── obstacle definitions ─────────────────────────────────────────
const OBS = [
  { id: 'mine',    label: 'NAVAL MINE', color: '#aaaaaa', r: 18, baseSpeed:   0, pattern: 'drift',  weight: 1 },
  { id: 'boat',    label: 'IRGCN BOAT', color: '#bbb8aa', r: 12, baseSpeed: 170, pattern: 'zigzag', weight: 3 },
  { id: 'drone',   label: 'SHAHED-136', color: '#d4cdb0', r: 11, baseSpeed:  95, pattern: 'sine',   weight: 2 },
  { id: 'missile', label: 'ANTI-SHIP',  color: '#ff4400', r:  7, baseSpeed: 210, pattern: 'homing', weight: 2 },
];

function pickType() {
  const progress = Math.min(distance / (FINISH_NM * NM_PX), 1);
  const pool = [];
  for (const t of OBS) {
    let w = t.weight;
    if (t.id === 'missile') w += progress * 3;
    if (t.id === 'drone')   w += progress * 1.5;
    for (let i = 0; i < Math.round(w); i++) pool.push(t);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function spawnObs() {
  const def = pickType();
  const margin = SHORE_W + def.r + 24;
  obstacles.push({
    type: def,
    x: margin + Math.random() * (LW - margin * 2),
    y: -def.r - 10,
    vx: (Math.random() - 0.5) * 40,
    vy: def.baseSpeed,
    phase: Math.random() * Math.PI * 2,
    driftDir: Math.random() < 0.5 ? 1 : -1,
    driftClock: 0,
    age: 0,
    r: def.r,
    shootClock: def.id === 'boat' ? 0.15 + Math.random() * 0.3 : 0,
    dead: false,
  });
}

function fireBullet(o) {
  // RPG round — aimed at the tanker with some spread; player can dodge by moving
  const ang0 = Math.atan2(player.y - o.y, player.x - o.x);
  const miss = (Math.random() < 0.5 ? -1 : 1) * (0.05 + Math.random() * 0.08);
  const ang  = ang0 + miss;
  const spd  = 320;
  bullets.push({
    x: o.x,
    y: o.y + 14,           // muzzle of the foredeck launcher
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    age: 0,
    life: 2.0,
    r: 5,                  // collision radius
  });
}

// ── particles ────────────────────────────────────────────────────
function boom(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 70 + Math.random() * 200;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
                     r: 2 + Math.random() * 5, life: 0.5 + Math.random() * 0.5,
                     age: 0, color });
  }
}

// ── draw helpers ─────────────────────────────────────────────────
function drawWater() {
  // fill the full canvas — shores are drawn on top, so coves get water too
  ctx.fillStyle = '#0c2540';
  ctx.fillRect(0, 0, LW, LH);

  ctx.save();
  const sp = scrollY % 32;
  ctx.strokeStyle = 'rgba(100,180,255,0.05)';
  ctx.lineWidth = 1;
  for (let y = -32 + sp; y < LH + 32; y += 32) {
    ctx.beginPath();
    for (let x = 0; x <= LW; x += 5) {
      const wx = Math.sin(x * 0.025 + y * 0.018) * 3;
      x === 0 ? ctx.moveTo(x, y + wx) : ctx.lineTo(x, y + wx);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ── shore geometry (wavy, scrolls with the strait) ──────────────
function shoreLeftAt(screenY) {
  const wy = screenY - scrollY;
  return SHORE_W + Math.sin(wy * 0.0085 + 0.4) * 14
                 + Math.sin(wy * 0.024  + 1.7) * 7;
}
function shoreRightAt(screenY) {
  const wy = screenY - scrollY;
  return LW - SHORE_W - Math.sin(wy * 0.0095 + 1.2) * 14
                       - Math.sin(wy * 0.027  + 4.1) * 7;
}

function _hash01(n) {
  n = (Math.sin(n * 12.9898) * 43758.5453);
  return n - Math.floor(n);
}

function drawShores() {
  const step = 4;

  // base land — left (sandy tan)
  const llg = ctx.createLinearGradient(0, 0, SHORE_W * 1.4, 0);
  llg.addColorStop(0, '#7a5028');
  llg.addColorStop(1, '#c89058');
  ctx.fillStyle = llg;
  ctx.beginPath();
  ctx.moveTo(0, -step);
  for (let y = -step; y <= LH + step; y += step) ctx.lineTo(shoreLeftAt(y), y);
  ctx.lineTo(0, LH + step);
  ctx.closePath();
  ctx.fill();

  // base land — right (terracotta)
  const rlg = ctx.createLinearGradient(WATER_R - 6, 0, LW, 0);
  rlg.addColorStop(0, '#a85030');
  rlg.addColorStop(1, '#722810');
  ctx.fillStyle = rlg;
  ctx.beginPath();
  ctx.moveTo(LW, -step);
  for (let y = -step; y <= LH + step; y += step) ctx.lineTo(shoreRightAt(y), y);
  ctx.lineTo(LW, LH + step);
  ctx.closePath();
  ctx.fill();

  // beach strip (lighter sand near the water on the left shore)
  ctx.fillStyle = '#dcb478';
  ctx.beginPath();
  for (let y = -step; y <= LH + step; y += step) {
    const sx = shoreLeftAt(y);
    if (y === -step) ctx.moveTo(sx, y);
    else ctx.lineTo(sx, y);
  }
  for (let y = LH + step; y >= -step; y -= step) {
    ctx.lineTo(shoreLeftAt(y) - 6, y);
  }
  ctx.closePath();
  ctx.fill();

  // dry mud / cracked earth strip on the right (Iranian) shore
  ctx.fillStyle = '#c46a44';
  ctx.beginPath();
  for (let y = -step; y <= LH + step; y += step) {
    const sx = shoreRightAt(y);
    if (y === -step) ctx.moveTo(sx, y);
    else ctx.lineTo(sx, y);
  }
  for (let y = LH + step; y >= -step; y -= step) {
    ctx.lineTo(shoreRightAt(y) + 6, y);
  }
  ctx.closePath();
  ctx.fill();

  // surf line — moving foam at the water's edge
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  for (let y = 0; y <= LH; y += 3) {
    const sx = shoreLeftAt(y);
    const wob = Math.sin((y + scrollY) * 0.35) * 0.7;
    y === 0 ? ctx.moveTo(sx + wob, y) : ctx.lineTo(sx + wob, y);
  }
  ctx.stroke();
  ctx.beginPath();
  for (let y = 0; y <= LH; y += 3) {
    const sx = shoreRightAt(y);
    const wob = Math.sin((y + scrollY) * 0.31 + 2) * 0.7;
    y === 0 ? ctx.moveTo(sx + wob, y) : ctx.lineTo(sx + wob, y);
  }
  ctx.stroke();

  // shore decorations, rocket craters, labels
  drawShoreDetails();
  drawCraters();
  drawShoreLabels();
}

function drawShoreDetails() {
  const SP = 50;
  const minWY = Math.floor((-40 - scrollY) / SP) * SP;
  const maxWY = Math.ceil ((LH + 40 - scrollY) / SP) * SP;

  for (let wy = minWY; wy <= maxWY; wy += SP) {
    const sy = wy + scrollY;
    if (sy < -20 || sy > LH + 20) continue;

    // LEFT (Oman/UAE)
    {
      const ht = _hash01(wy * 0.137 + 13);
      const hp = _hash01(wy * 0.091 + 21);
      const sx = shoreLeftAt(sy) - 10 - hp * (SHORE_W * 0.6);
      if (sx > 5) drawShoreObj(sx, sy, ht, 'left', wy);
    }
    // RIGHT (Iran)
    {
      const ht = _hash01(wy * 0.183 + 41);
      const hp = _hash01(wy * 0.127 + 71);
      const sx = shoreRightAt(sy) + 10 + hp * (SHORE_W * 0.6);
      if (sx < LW - 5) drawShoreObj(sx, sy, ht, 'right', wy);
    }
  }
}

function drawShoreObj(x, y, t, side, wy) {
  ctx.save();
  ctx.translate(x, y);

  if (t < 0.42) {
    // palm tree (top-down — fronds spreading from a small trunk)
    ctx.strokeStyle = '#3a6520';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + _hash01(wy + i) * 0.4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * 5, Math.sin(a) * 5);
      ctx.stroke();
    }
    ctx.fillStyle = '#5a3818';
    ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, Math.PI * 2); ctx.fill();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.arc(1, 1, 5, 0, Math.PI * 2); ctx.fill();
  } else if (t < 0.78) {
    // rocks — small cluster
    ctx.fillStyle = side === 'left' ? '#7a5028' : '#5a2818';
    ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = side === 'left' ? '#a07a48' : '#7a3820';
    ctx.beginPath(); ctx.arc(2, 1, 1.8, 0, Math.PI * 2); ctx.fill();
    if (_hash01(wy * 0.5 + 7) < 0.5) {
      ctx.fillStyle = side === 'left' ? '#603a18' : '#421808';
      ctx.beginPath(); ctx.arc(-2, 2, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    // small building (whitewashed hut on Oman side, terracotta on Iran side)
    ctx.fillStyle = side === 'left' ? '#ece4c8' : '#c46838';
    ctx.fillRect(-4, -3, 8, 7);
    // flat roof
    ctx.fillStyle = side === 'left' ? '#a87838' : '#722810';
    ctx.fillRect(-4, -3, 8, 1.5);
    // door
    ctx.fillStyle = '#222';
    ctx.fillRect(-1, 1, 2, 3);
  }

  ctx.restore();
}

// Countries along the southern (left) shore, in the order you sail past them.
// Iran holds the whole northern (right) shore.
const COUNTRIES = [
  { from: 0,  flag: '🇴🇲', lines: ['OMAN'],            name: 'OMAN' },
  { from: 30, flag: '🇦🇪', lines: ['UAE'],             name: 'UAE' },
  { from: 65, flag: '🇸🇦', lines: ['SAUDI', 'ARABIA'], name: 'SAUDI ARABIA' },
];

// World y -> the nm mark at which that bit of coast is alongside the tanker.
function nmAtWorldY(wy) { return (PLAYER_Y - wy) / NM_PX; }
function countryAtNm(nm) {
  let c = COUNTRIES[0];
  for (const k of COUNTRIES) if (nm >= k.from) c = k;
  return c;
}

function drawShoreLabels() {
  const SP = 240;
  const startWY = Math.floor((-80 - scrollY) / SP) * SP;
  const endWY   = Math.ceil ((LH + 80 - scrollY) / SP) * SP;

  // dashed border lines across the southern shore
  ctx.save();
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.5;
  for (const c of COUNTRIES.slice(1)) {
    const sy = PLAYER_Y - c.from * NM_PX + scrollY;
    if (sy < -10 || sy > LH + 10) continue;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(shoreLeftAt(sy), sy); ctx.stroke();
  }
  ctx.restore();

  // Each label slides (deterministically) to the widest bit of land near its slot.
  for (let wy = startWY; wy <= endWY; wy += SP) {
    {
      let best = wy, bestW = -1;
      for (let d = -60; d <= 60; d += 6) {
        const w = shoreLeftAt(wy + d + scrollY);
        if (w > bestW) { bestW = w; best = wy + d; }
      }
      const sy = best + scrollY;
      const c = countryAtNm(nmAtWorldY(best));
      if (sy > 60 && sy < LH - 30) drawMapLabel(c.flag, c.lines, 'left', bestW, sy, '#fff2d8');
    }
    {
      const base = wy + SP / 2;   // staggered so the two sides don't line up
      let best = base, bestX = LW;
      for (let d = -60; d <= 60; d += 6) {
        const x = shoreRightAt(base + d + scrollY);
        if (x < bestX) { bestX = x; best = base + d; }
      }
      const sy = best + scrollY;
      if (sy > 60 && sy < LH - 30) drawMapLabel('🇮🇷', ['IRAN'], 'right', bestX, sy, '#ffe8d0');
    }
  }
}

// Browsers disagree about how wide a flag emoji is (some measure the two
// regional-indicator letters, not the drawn flag), so textAlign:center drifts.
// Render each flag once offscreen, find its real pixel bounds, and draw that.
const flagCache = {};
function flagSprite(flag) {
  if (flagCache[flag]) return flagCache[flag];
  const S = 4, size = 14;                       // 4x supersampled for sharpness
  const c = document.createElement('canvas');
  c.width = size * 4 * S; c.height = size * 2 * S;
  const x = c.getContext('2d');
  x.font = (size * S) + 'px serif';
  x.textBaseline = 'middle';
  x.fillText(flag, size * S, c.height / 2);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, x1 = -1, y0 = c.height, y1 = -1;
  for (let py = 0; py < c.height; py++) {
    for (let px = 0; px < c.width; px++) {
      if (d[(py * c.width + px) * 4 + 3] > 8) {
        if (px < x0) x0 = px; if (px > x1) x1 = px;
        if (py < y0) y0 = py; if (py > y1) y1 = py;
      }
    }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = 1; y1 = 1; }   // nothing drew; avoid a zero-size sprite
  const out = document.createElement('canvas');
  out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(c, -x0, -y0);
  return (flagCache[flag] = { img: out, w: out.width / S, h: out.height / S });
}

// Old-school map lettering: bold text with a dark outline, flag stacked on top.
function drawMapLabel(flag, lines, side, coastX, cy, color) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px ' + MONO;
  const w  = Math.max(...lines.map(l => ctx.measureText(l).width));
  const lh = 13, flagH = 16;
  const top = cy - (flagH + lines.length * lh) / 2;
  let cx = side === 'left' ? coastX / 2 : (coastX + LW) / 2;
  cx = Math.max(3 + w / 2, Math.min(LW - 3 - w / 2, cx));

  const fl = flagSprite(flag);
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 3;
  ctx.drawImage(fl.img, cx - fl.w / 2, top + (flagH - fl.h) / 2, fl.w, fl.h);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 12px ' + MONO;
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = 'rgba(20,10,0,0.9)';
  ctx.fillStyle = color;
  lines.forEach((l, i) => {
    const y = top + flagH + lh / 2 + i * lh;
    ctx.strokeText(l, cx, y);
    ctx.fillText(l, cx, y);
  });
  ctx.restore();
}

// Ship hull outline: pointed bow at -hh, flat transom at +hh.
function hullPath(hw, hh, bowLen) {
  ctx.beginPath();
  ctx.moveTo(0, -hh);
  ctx.bezierCurveTo(hw * 0.55, -hh + 1, hw, -hh + bowLen * 0.45, hw, -hh + bowLen);
  ctx.lineTo(hw, hh - 5);
  ctx.quadraticCurveTo(hw, hh, hw - 5, hh);
  ctx.lineTo(-hw + 5, hh);
  ctx.quadraticCurveTo(-hw, hh, -hw, hh - 5);
  ctx.lineTo(-hw, -hh + bowLen);
  ctx.bezierCurveTo(-hw, -hh + bowLen * 0.45, -hw * 0.55, -hh + 1, 0, -hh);
  ctx.closePath();
}

// Foam trail behind a ship's transom (at +hh), animated.
function drawWake(hw, hh, len, T) {
  const wg = ctx.createLinearGradient(0, hh, 0, hh + len);
  wg.addColorStop(0, 'rgba(255,255,255,0.32)');
  wg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.moveTo(-hw + 3, hh - 1);
  ctx.lineTo(-hw - len * 0.3, hh + len);
  ctx.lineTo( hw + len * 0.3, hh + len);
  ctx.lineTo( hw - 3, hh - 1);
  ctx.closePath();
  ctx.fill();
  // churned prop-wash
  for (let i = 0; i < 6; i++) {
    const ph = (T * 1.4 + i / 6) % 1;
    ctx.fillStyle = `rgba(255,255,255,${0.4 * (1 - ph)})`;
    ctx.beginPath();
    ctx.ellipse(Math.sin(T * 5 + i * 2.1) * hw * 0.25, hh + 3 + ph * len * 0.7,
                2 + ph * hw * 0.45, 1.5 + ph * 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Bow wave peeling off a pointed bow at -hh.
function drawBowWave(hw, hh, T) {
  ctx.strokeStyle = `rgba(255,255,255,${0.55 + 0.15 * Math.sin(T * 6)})`;
  ctx.lineWidth = 1.4;
  for (const sgn of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(0, -hh - 1.5);
    ctx.quadraticCurveTo(sgn * (hw + 2), -hh + hh * 0.25, sgn * (hw + 7), -hh + hh * 0.75);
    ctx.stroke();
  }
}

function drawTanker(x, y, flagEmoji, alpha) {
  const T = performance.now() / 1000;
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.translate(x, y);

  const hw = TW / 2, hh = TH / 2, bow = 20;

  drawWake(hw, hh, 52, T);
  drawBowWave(hw, hh, T);

  // drop shadow on the water
  ctx.save();
  ctx.translate(3, 4);
  hullPath(hw, hh, bow);
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.fill();
  ctx.restore();

  // red boot-topping showing at the waterline, then the dark hull
  hullPath(hw + 1.2, hh + 1.2, bow + 1);
  ctx.fillStyle = '#b8321f';
  ctx.fill();
  hullPath(hw, hh, bow);
  ctx.fillStyle = '#1f262e';
  ctx.fill();

  // main deck (classic tanker green), everything below is clipped to it
  ctx.save();
  hullPath(hw - 2.2, hh - 2.2, bow - 1);
  ctx.fillStyle = '#41672f';
  ctx.fill();
  ctx.clip();

  // forecastle (raised red deck at the bow)
  ctx.fillStyle = '#8a3324';
  ctx.fillRect(-hw, -hh, TW, 18);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(-hw, -hh + 18, TW, 1.2);
  // anchor windlasses + chains running to the hawse pipes
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-5, -hh + 11); ctx.lineTo(-3, -hh + 4);
  ctx.moveTo( 5, -hh + 11); ctx.lineTo( 3, -hh + 4);
  ctx.stroke();
  ctx.fillStyle = '#9aa3a8';
  for (const sx of [-5, 5]) { ctx.beginPath(); ctx.arc(sx, -hh + 12, 2.2, 0, Math.PI * 2); ctx.fill(); }

  // deck pipelines + centre catwalk
  ctx.strokeStyle = '#8f989d';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const px of [-4.5, 4.5]) { ctx.moveTo(px, -hh + 19); ctx.lineTo(px, hh - 24); }
  ctx.stroke();
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (const px of [-7, 7]) { ctx.moveTo(px, -hh + 19); ctx.lineTo(px, hh - 24); }
  ctx.stroke();
  ctx.fillStyle = '#d6cfb4';
  ctx.fillRect(-1.3, -hh + 19, 2.6, TH - 43);

  // tank hatches down each side
  for (let ty = -hh + 25; ty < hh - 26; ty += 8) {
    for (const hx of [-11.5, 11.5]) {
      ctx.fillStyle = '#26381c';
      ctx.beginPath(); ctx.arc(hx, ty, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.arc(hx - 0.5, ty - 0.5, 0.7, 0, Math.PI * 2); ctx.fill();
    }
  }

  // midship manifold + yellow hose cranes
  ctx.strokeStyle = '#b4bbbe';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-hw, -2); ctx.lineTo(hw, -2); ctx.stroke();
  ctx.strokeStyle = '#e8c020';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-10, -7); ctx.lineTo(-3, -11);
  ctx.moveTo( 10, -7); ctx.lineTo( 3, -11);
  ctx.stroke();
  ctx.fillStyle = '#e8c020';
  for (const cx of [-10, 10]) { ctx.beginPath(); ctx.arc(cx, -7, 2, 0, Math.PI * 2); ctx.fill(); }

  ctx.restore(); // end deck clip

  // lifeboats (orange) beside the accommodation block
  ctx.fillStyle = '#ff7a1a';
  ctx.strokeStyle = '#7a2a00';
  ctx.lineWidth = 0.5;
  for (const lx of [-15.5, 12.5]) {
    ctx.fillRect(lx, hh - 19, 3, 8);
    ctx.strokeRect(lx, hh - 19, 3, 8);
  }

  // accommodation block — elevated, so it casts its own shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(-10, hh - 21, 23, 15);
  ctx.fillStyle = '#eef0ec';
  ctx.fillRect(-12, hh - 23, 24, 15);
  // bridge wings spanning the full beam
  ctx.fillRect(-hw - 0.5, hh - 24, TW + 1, 3.2);
  ctx.strokeStyle = '#8a8f92';
  ctx.lineWidth = 0.6;
  ctx.strokeRect(-12, hh - 23, 24, 15);
  ctx.strokeRect(-hw - 0.5, hh - 24, TW + 1, 3.2);
  // bridge windows facing forward
  ctx.fillStyle = '#21455f';
  ctx.fillRect(-10, hh - 23.6, 20, 1.8);
  // roof: mast with spinning radar
  ctx.fillStyle = '#c9cdd0';
  ctx.fillRect(-1, hh - 18, 2, 2);
  ctx.save();
  ctx.translate(0, hh - 17);
  ctx.rotate(T * 3);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-4.5, 0); ctx.lineTo(4.5, 0); ctx.stroke();
  ctx.restore();

  // funnel with a red company band
  ctx.fillStyle = '#c4302b';
  ctx.fillRect(-4, hh - 9, 8, 5);
  ctx.fillStyle = '#f2f2f2';
  ctx.fillRect(-4, hh - 7.5, 8, 1.2);
  ctx.fillStyle = '#111';
  ctx.fillRect(-4, hh - 9, 8, 1.4);

  // exhaust smoke drifting astern
  for (let i = 0; i < 5; i++) {
    const ph = (T * 0.7 + i / 5) % 1;
    ctx.fillStyle = `rgba(60,60,60,${0.38 * (1 - ph)})`;
    ctx.beginPath();
    ctx.arc(Math.sin(T * 1.5 + i) * 2 + ph * 3, hh - 7 + ph * 34, 2 + ph * 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // ensign at the stern
  ctx.font = '11px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(flagEmoji, 0, hh + 5);

  ctx.restore();
}

function drawMine(x, y, r, age) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(age * 0.25);

  // body — matte black with subtle highlight
  const bg = ctx.createRadialGradient(-r * 0.4, -r * 0.4, 1, 0, 0, r);
  bg.addColorStop(0, '#3a3a3a');
  bg.addColorStop(0.6, '#101010');
  bg.addColorStop(1, '#000000');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // rust patches
  ctx.fillStyle = 'rgba(140, 60, 20, 0.5)';
  ctx.beginPath();
  ctx.arc(r * 0.25, r * 0.15, r * 0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-r * 0.4, r * 0.3, r * 0.14, 0, Math.PI * 2);
  ctx.fill();

  // horns / contact spikes
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a) * (r + 7), Math.sin(a) * (r + 7));
    ctx.stroke();
    // lead horn tip
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.arc(Math.cos(a) * (r + 8), Math.sin(a) * (r + 8), 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  ctx.restore();
}

function drawSpeedboat(x, y, r, age) {
  ctx.save();
  ctx.translate(x, y);
  // bow points DOWN — boat is charging the tanker

  // wake spray behind (above the boat)
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.5;
  const wob = Math.sin(age * 14) * 1.5;
  ctx.beginPath();
  ctx.moveTo(-r * 0.7, -r * 1.2); ctx.lineTo(-r * 1.1 + wob, -r * 2.0);
  ctx.moveTo( r * 0.7, -r * 1.2); ctx.lineTo( r * 1.1 - wob, -r * 2.0);
  ctx.stroke();

  // hull (light gray — typical IRGCN fast boat)
  ctx.fillStyle = '#b8b4a8';
  ctx.beginPath();
  ctx.moveTo(0, r * 1.7);              // pointed bow (front, downward)
  ctx.lineTo(r * 0.75, r * 0.6);
  ctx.lineTo(r * 0.75, -r * 1.3);      // stern right
  ctx.lineTo(-r * 0.75, -r * 1.3);     // stern left
  ctx.lineTo(-r * 0.75, r * 0.6);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 1;
  ctx.stroke();

  // green stripe along the gunwale (Iranian flag accent)
  ctx.fillStyle = '#1a7a2a';
  ctx.fillRect(-r * 0.75, -r * 0.4, r * 1.5, 1.5);
  ctx.fillStyle = '#cc2222';
  ctx.fillRect(-r * 0.75, -r * 0.2, r * 1.5, 1);

  // center console / cabin
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(-r * 0.4, -r * 0.7, r * 0.8, r * 0.55);
  ctx.fillStyle = '#1a3a55';
  ctx.fillRect(-r * 0.32, -r * 0.62, r * 0.64, 1.5);  // windshield

  // crew dots
  ctx.fillStyle = '#3a2410';
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.05, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( r * 0.3, -r * 0.05, 1.4, 0, Math.PI * 2); ctx.fill();

  // mounted heavy machine gun on foredeck
  ctx.fillStyle = '#222';
  // mount base
  ctx.beginPath(); ctx.arc(0, r * 0.7, r * 0.22, 0, Math.PI * 2); ctx.fill();
  // gun barrel pointing forward
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(0, r * 0.7);
  ctx.lineTo(0, r * 1.4);
  ctx.stroke();
  // muzzle tip
  ctx.fillStyle = '#444';
  ctx.beginPath(); ctx.arc(0, r * 1.4, 1.3, 0, Math.PI * 2); ctx.fill();

  // outboard motors at stern
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-r * 0.5, -r * 1.4, r * 0.25, r * 0.25);
  ctx.fillRect( r * 0.25, -r * 1.4, r * 0.25, r * 0.25);

  ctx.restore();
}

function drawDrone(x, y, r, age) {
  ctx.save();
  ctx.translate(x, y);
  // Shahed-136 — delta wedge, nose pointing DOWN (toward target)

  const R = r * 1.6;

  // delta wing body — pale beige
  ctx.fillStyle = '#d4cdb0';
  ctx.beginPath();
  ctx.moveTo(0, R);                    // nose (pointed, downward)
  ctx.lineTo(R * 0.95, -R * 0.45);     // right wingtip
  ctx.lineTo(R * 0.32, -R * 0.6);      // back-right
  ctx.lineTo(-R * 0.32, -R * 0.6);     // back-left
  ctx.lineTo(-R * 0.95, -R * 0.45);    // left wingtip
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#5a4f30';
  ctx.lineWidth = 1;
  ctx.stroke();

  // fuselage centerline (slightly darker spine)
  ctx.fillStyle = '#aea582';
  ctx.beginPath();
  ctx.moveTo(0, R * 0.95);
  ctx.lineTo(R * 0.12, -R * 0.55);
  ctx.lineTo(-R * 0.12, -R * 0.55);
  ctx.closePath();
  ctx.fill();

  // V-tail fins at the rear
  ctx.fillStyle = '#9a8e68';
  ctx.beginPath();
  ctx.moveTo(-R * 0.32, -R * 0.6);
  ctx.lineTo(-R * 0.55, -R * 0.92);
  ctx.lineTo(-R * 0.18, -R * 0.6);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo( R * 0.32, -R * 0.6);
  ctx.lineTo( R * 0.55, -R * 0.92);
  ctx.lineTo( R * 0.18, -R * 0.6);
  ctx.closePath();
  ctx.fill();

  // rear-mounted propeller (motion blur ring + spinning blades)
  ctx.strokeStyle = 'rgba(40,30,15,0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.arc(0, -R * 0.7, R * 0.28, 0, Math.PI * 2);
  ctx.stroke();
  // spinning blade
  ctx.strokeStyle = 'rgba(20,15,10,0.85)';
  ctx.lineWidth = 1.4;
  const sa = age * 32;
  ctx.beginPath();
  ctx.moveTo(Math.cos(sa) * R * 0.28, -R * 0.7 + Math.sin(sa) * R * 0.28);
  ctx.lineTo(-Math.cos(sa) * R * 0.28, -R * 0.7 - Math.sin(sa) * R * 0.28);
  ctx.stroke();
  // hub
  ctx.fillStyle = '#3a3020';
  ctx.beginPath();
  ctx.arc(0, -R * 0.7, 1.3, 0, Math.PI * 2);
  ctx.fill();

  // nose camera dot
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, R * 0.78, 1.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawMissile(x, y, r, vy, vx) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(vy, vx) + Math.PI / 2);

  ctx.fillStyle = '#ff2200';
  ctx.fillRect(-r * 0.55, -r * 2, r * 1.1, r * 3.5);

  ctx.fillStyle = '#ff6600';
  ctx.beginPath();
  ctx.moveTo(-r * 0.55, -r * 2);
  ctx.lineTo(r * 0.55, -r * 2);
  ctx.lineTo(0, -r * 3.4);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#cc1100';
  ctx.beginPath();
  ctx.moveTo(-r * 0.55, r * 1.2); ctx.lineTo(-r * 1.5, r * 2.2); ctx.lineTo(-r * 0.55, r * 2.2);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.55, r * 1.2); ctx.lineTo(r * 1.5, r * 2.2); ctx.lineTo(r * 0.55, r * 2.2);
  ctx.closePath(); ctx.fill();

  const eg = ctx.createLinearGradient(0, r * 1.5, 0, r * 3.8);
  eg.addColorStop(0, 'rgba(255,180,0,0.9)');
  eg.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.ellipse(0, r * 2.4, r * 0.7, r * 1.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Iowa-style triple turret, drawn in the boss's bow-up local space.
// dir = -1: guns face the bow; dir = +1: guns face the stern.
function drawTriTurret(yc, dir, sc = 1) {
  ctx.save();
  ctx.translate(0, yc);
  ctx.scale(sc, sc * -dir);   // after this, "up" is always where the guns point

  // barrels (long, tapered, with blast bags at the root)
  for (const ox of [-4.2, 0, 4.2]) {
    ctx.fillStyle = '#2a2414';
    ctx.beginPath();
    ctx.moveTo(ox - 1.5, -6);
    ctx.lineTo(ox - 1,   -27);
    ctx.lineTo(ox + 1,   -27);
    ctx.lineTo(ox + 1.5, -6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d9c9a0';
    ctx.fillRect(ox - 1.7, -10, 3.4, 3);
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(ox, -27, 1.1, 0, Math.PI * 2); ctx.fill();
  }

  // barbette ring
  ctx.fillStyle = '#5a4000';
  ctx.beginPath(); ctx.arc(0, 1, 12.5, 0, Math.PI * 2); ctx.fill();

  // turret house: flat sloped face, rounded back
  const g = ctx.createLinearGradient(-11, 0, 11, 0);
  g.addColorStop(0, '#a87a08');
  g.addColorStop(0.45, '#ffe27a');
  g.addColorStop(1, '#a87a08');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-7, -9);
  ctx.lineTo(7, -9);
  ctx.lineTo(11, -2);
  ctx.quadraticCurveTo(11, 10, 0, 11);
  ctx.quadraticCurveTo(-11, 10, -11, -2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4a3400';
  ctx.lineWidth = 1;
  ctx.stroke();
  // rangefinder ears
  ctx.fillStyle = '#7a5800';
  ctx.fillRect(-12.5, 3, 3, 2.5);
  ctx.fillRect(9.5, 3, 3, 2.5);
  ctx.restore();
}

function drawStar(cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 ? r * 0.42 : r;
    ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
}

function drawBoss(b) {
  const T = performance.now() / 1000;
  const bw = 60, bh = 200;
  const hw = bw / 2, hh = bh / 2, bow = 62;

  ctx.save();
  ctx.translate(b.x, b.y);

  // pulsing golden aura
  const gg = ctx.createRadialGradient(0, 0, 30, 0, 0, bh * 0.85);
  gg.addColorStop(0, `rgba(255,215,0,${0.26 + 0.08 * Math.sin(T * 3)})`);
  gg.addColorStop(0.5, 'rgba(255,165,0,0.10)');
  gg.addColorStop(1, 'rgba(255,165,0,0)');
  ctx.fillStyle = gg;
  ctx.fillRect(-bw * 1.5, -bh, bw * 3, bh * 2);

  // Everything below is drawn bow-up, then turned 180° so the bow and the
  // forward guns point down the screen, straight at the player.
  ctx.save();
  ctx.rotate(Math.PI);

  drawWake(hw, hh, 70, T);
  drawBowWave(hw, hh, T);

  // shadow (offset is flipped because we're rotated)
  ctx.save();
  ctx.translate(-4, -5);
  hullPath(hw, hh, bow);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();
  ctx.restore();

  // gold hull with a polished highlight
  const hullG = ctx.createLinearGradient(-hw, 0, hw, 0);
  hullG.addColorStop(0,    '#7a5000');
  hullG.addColorStop(0.3,  '#d8a418');
  hullG.addColorStop(0.5,  '#ffe58a');
  hullG.addColorStop(0.7,  '#d8a418');
  hullG.addColorStop(1,    '#7a5000');
  hullPath(hw, hh, bow);
  ctx.fillStyle = hullG;
  ctx.fill();
  ctx.strokeStyle = '#3a2800';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // gold-teak deck with planking, clipped
  ctx.save();
  hullPath(hw - 3, hh - 3, bow - 2);
  ctx.fillStyle = '#b8871e';
  ctx.fill();
  ctx.clip();
  ctx.strokeStyle = 'rgba(70,45,0,0.22)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  for (let px = -hw; px <= hw; px += 3) { ctx.moveTo(px, -hh); ctx.lineTo(px, hh); }
  ctx.stroke();
  // travelling shine — it's the Golden Edition
  const sy = ((T * 0.45) % 1.6 - 0.3) * bh * 1.2 - hh;
  const sg = ctx.createLinearGradient(0, sy - 30, 0, sy + 30);
  sg.addColorStop(0, 'rgba(255,255,220,0)');
  sg.addColorStop(0.5, 'rgba(255,255,220,0.35)');
  sg.addColorStop(1, 'rgba(255,255,220,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(-hw, sy - 30, bw, 60);
  ctx.restore();

  // main battery: two forward (superfiring), one aft
  drawTriTurret(-hh + 52, -1, 1);
  drawTriTurret(-hh + 80, -1, 1.1);
  drawTriTurret(hh - 38, 1, 1);

  // 5-inch secondary mounts along both sides
  for (const my of [-hh + 104, -hh + 120, -hh + 136]) {
    for (const sgn of [-1, 1]) {
      ctx.strokeStyle = '#2a2414';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(sgn * (hw - 9), my - 1.5); ctx.lineTo(sgn * (hw - 1), my - 1.5);
      ctx.moveTo(sgn * (hw - 9), my + 1.5); ctx.lineTo(sgn * (hw - 1), my + 1.5);
      ctx.stroke();
      ctx.fillStyle = '#c8961c';
      ctx.fillRect(sgn * (hw - 9) - 3.5, my - 3.5, 7, 7);
      ctx.strokeStyle = '#5a4000';
      ctx.lineWidth = 0.8;
      ctx.strokeRect(sgn * (hw - 9) - 3.5, my - 3.5, 7, 7);
    }
  }

  // superstructure — stepped levels with hard shadows
  const level = (x, y, w, h, c) => {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x - 2, y - 2, w, h);
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#5a4000';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(x, y, w, h);
  };
  level(-17, -hh + 96, 34, 56, '#a87808');
  level(-13, -hh + 98, 26, 30, '#c8961c');
  level(-9,  -hh + 99, 18, 12, '#e0b030');
  // bridge windows (face the bow)
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-8, -hh + 99.5, 16, 2);

  // mast with spinning radar
  ctx.save();
  ctx.translate(0, -hh + 118);
  ctx.fillStyle = '#5a4000';
  ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(T * 2.5);
  ctx.strokeStyle = '#2a1e00';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.stroke();
  ctx.restore();

  // twin funnels + smoke streaming astern
  for (const fy of [-hh + 132, -hh + 146]) {
    ctx.fillStyle = '#6a4a00';
    ctx.beginPath(); ctx.ellipse(0, fy, 6, 7.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1200';
    ctx.beginPath(); ctx.ellipse(0, fy, 4, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < 6; i++) {
    const ph = (T * 0.6 + i / 6) % 1;
    ctx.fillStyle = `rgba(50,45,35,${0.35 * (1 - ph)})`;
    ctx.beginPath();
    ctx.arc(Math.sin(T * 1.3 + i) * 3, -hh + 146 + ph * 60, 3 + ph * 8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore(); // end 180° rotation — back to screen orientation

  // big white star on the foredeck (drawn upright)
  drawStar(0, hh - 16, 5.5, '#fffbe8');

  // glints
  for (let i = 0; i < 4; i++) {
    const a = Math.max(0, Math.sin(T * 3 + i * 1.9));
    if (a < 0.05) continue;
    const gx = (_hash01(i * 7.3) - 0.5) * (bw - 16);
    const gy = (_hash01(i * 3.1 + 2) - 0.5) * (bh - 50);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#fffbe0';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(gx - 5 * a, gy); ctx.lineTo(gx + 5 * a, gy);
    ctx.moveTo(gx, gy - 5 * a); ctx.lineTo(gx, gy + 5 * a);
    ctx.stroke();
    ctx.restore();
  }

  // US ensign at the stern (top of screen)
  ctx.font = '13px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🇺🇸', 0, -hh - 8);

  ctx.restore();
}

function drawHUD() {
  const nm = Math.floor(distance / NM_PX);
  const HUD_H = 46;

  ctx.save();
  // background bar
  const hg = ctx.createLinearGradient(0, 0, 0, HUD_H);
  hg.addColorStop(0, 'rgba(0,0,0,0.7)');
  hg.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, LW, HUD_H);
  // bottom border
  ctx.strokeStyle = 'rgba(91,192,248,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(LW, HUD_H); ctx.stroke();

  ctx.textBaseline = 'middle';

  // top row — tanker name (left) and NM (right)
  ctx.font = 'bold 11px Courier New';
  ctx.fillStyle = '#5bc0f8';
  ctx.textAlign = 'left';
  ctx.fillText(FLAGS[selectedFlag].emoji + ' ' + tankerName.toUpperCase(), 8, 13);

  ctx.textAlign = 'right';
  const nmStr = nm + ' / ' + FINISH_NM + ' NM';
  ctx.fillStyle = nm >= FINISH_NM ? '#ffd700' : '#5bc0f8';
  ctx.fillText(nmStr, LW - 8, 13);

  // distance progress bar (under NM, right-aligned)
  const pbW = 150, pbH = 5, pbX = LW - 8 - pbW, pbY = 32;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(pbX, pbY, pbW, pbH);
  ctx.fillStyle = '#2a7fbf';
  ctx.fillRect(pbX, pbY, pbW * (distance / (FINISH_NM * NM_PX)), pbH);
  ctx.strokeStyle = 'rgba(91,192,248,0.4)';
  ctx.strokeRect(pbX + 0.5, pbY + 0.5, pbW - 1, pbH - 1);

  // damage meter (left, under name)
  const dmgW = 150, dmgH = 9, dmgX = 8, dmgY = 30;
  // label
  ctx.font = 'bold 8px Courier New';
  ctx.fillStyle = '#88a4b8';
  ctx.textAlign = 'left';
  ctx.fillText('HULL', dmgX, dmgY + dmgH / 2);
  const barX = dmgX + 28;

  // back
  ctx.fillStyle = '#0a1620';
  ctx.fillRect(barX, dmgY, dmgW, dmgH);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.strokeRect(barX + 0.5, dmgY + 0.5, dmgW - 1, dmgH - 1);

  // fill
  const dmgPct = damage / 100;
  let dmgCol = '#22cc44';
  if (dmgPct > 0.4) dmgCol = '#ddaa00';
  if (dmgPct > 0.7) dmgCol = '#cc3300';
  // fill from RIGHT toward left as damage rises (hull is "depleted")
  const remW = dmgW * (1 - dmgPct);
  ctx.fillStyle = dmgCol;
  ctx.fillRect(barX, dmgY, remW, dmgH);
  // segment ticks every 10%
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) {
    const tx = barX + (dmgW * i / 10);
    ctx.beginPath(); ctx.moveTo(tx, dmgY); ctx.lineTo(tx, dmgY + dmgH); ctx.stroke();
  }

  // damage % text
  ctx.font = 'bold 8px Courier New';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'right';
  ctx.fillText(Math.floor(100 - damage) + '%', barX + dmgW - 3, dmgY + dmgH / 2 + 0.5);

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.age / p.life;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a + 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of bullets) {
    const a   = Math.max(0, 1 - b.age / b.life);
    const ang = Math.atan2(b.vy, b.vx);

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    ctx.globalAlpha = a;

    // smoke + flame trail behind the rocket
    const trailLen = 26;
    const grad = ctx.createLinearGradient(-trailLen, 0, -3, 0);
    grad.addColorStop(0,    'rgba(180,180,180,0)');
    grad.addColorStop(0.45, 'rgba(220,200,180,0.45)');
    grad.addColorStop(0.85, 'rgba(255,180,80,0.85)');
    grad.addColorStop(1,    'rgba(255,240,180,1)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-trailLen, -2.2);
    ctx.lineTo(-3,        -3.2);
    ctx.lineTo(-3,         3.2);
    ctx.lineTo(-trailLen,  2.2);
    ctx.closePath();
    ctx.fill();

    // tail fins
    ctx.fillStyle = '#2a3528';
    ctx.beginPath();
    ctx.moveTo(-3, -2.5);
    ctx.lineTo(-6, -4.5);
    ctx.lineTo(-1, -2.5);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-3,  2.5);
    ctx.lineTo(-6,  4.5);
    ctx.lineTo(-1,  2.5);
    ctx.closePath();
    ctx.fill();

    // body (cylindrical, olive drab)
    ctx.fillStyle = '#445a3a';
    ctx.fillRect(-3, -2.6, 9, 5.2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-3, 0.6, 9, 2);

    // warhead (bulbous nose typical of RPG-7 PG-7V round)
    ctx.fillStyle = '#5a3a26';
    ctx.beginPath();
    ctx.moveTo(6, -3.6);
    ctx.quadraticCurveTo(11, -3.6, 12, 0);
    ctx.quadraticCurveTo(11,  3.6, 6,  3.6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.moveTo(6, 0.4);
    ctx.quadraticCurveTo(10, 1.6, 12, 0);
    ctx.lineTo(6, 0.4);
    ctx.closePath();
    ctx.fill();

    // fuse tip
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(12, 0, 1.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// ── update ───────────────────────────────────────────────────────
function updateParticles(dt) {
  for (const p of particles) {
    p.age += dt;
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.vy += 50 * dt;
  }
  particles = particles.filter(p => p.age < p.life);
}

function updateObs(o, dt) {
  o.age += dt;
  o.y += (o.vy + scrollSpeed) * dt;

  switch (o.type.pattern) {
    case 'drift':
      o.driftClock += dt;
      if (o.driftClock > 1.6) { o.driftDir *= -1; o.driftClock = 0; }
      o.x += o.driftDir * 20 * dt;
      break;
    // Boats and drones weave around a "lane" centre instead of integrating
    // velocity, so they can't get pinned against the shore. The lane is kept
    // far enough from both banks that the full weave stays on the water.
    case 'zigzag':      // IRGCN boats: tight weave, lane creeps toward the tanker
    case 'sine': {      // drones: wide lazy weave, mostly hold their lane
      const zig  = o.type.pattern === 'zigzag';
      const amp  = zig ? 48 : 42;
      const freq = zig ? 3 : 2;
      // drones are drawn ~1.6x their hit radius, so give them extra clearance
      const clear = zig ? o.r + 10 : o.r * 1.6 + 22;
      if (o.lane === undefined) o.lane = o.x;
      o.lane += (player.x - o.lane) * (zig ? 0.35 : 0.3) * dt;
      const lo = shoreLeftAt(o.y)  + clear + amp;
      const hi = shoreRightAt(o.y) - clear - amp;
      o.lane = lo < hi ? Math.max(lo, Math.min(hi, o.lane)) : (lo + hi) / 2;
      const nx = o.lane + Math.sin(o.age * freq + o.phase) * amp;
      o.vx = (nx - o.x) / Math.max(dt, 1e-4);
      o.x  = nx;
      break;
    }
    case 'homing': {
      const dx = player.x - o.x;
      o.vx += dx * 1.1 * dt;
      o.vx = Math.max(-150, Math.min(150, o.vx));
      o.x += o.vx * dt;
      break;
    }
  }

  const olb = shoreLeftAt(o.y)  + o.r + 2;
  const orb = shoreRightAt(o.y) - o.r - 2;
  o.x = Math.max(olb, Math.min(orb, o.x));

  // boats fire RPGs at the tanker while they're ahead of it
  if (o.type.id === 'boat' && o.y > 10 && o.y < player.y - 90) {
    o.shootClock -= dt;
    if (o.shootClock <= 0) {
      o.shootClock = 0.9 + Math.random() * 0.6;
      fireBullet(o);
    }
  }
}

// The tanker is long and thin, so collide against a capsule running down its
// centreline (bow to stern) rather than a single circle in the middle.
const HULL_R    = TW / 2 - 3;           // half-beam, a touch forgiving
const HULL_HALF = TH / 2 - HULL_R;      // half-length of the centreline segment
function hullDist(x, y) {
  const dy = Math.max(-HULL_HALF, Math.min(HULL_HALF, y - player.y));
  return Math.hypot(x - player.x, y - (player.y + dy));
}
function hits(o) {
  return hullDist(o.x, o.y) < o.r * 0.8 + HULL_R;
}

function update(dt) {
  updateRockets(dt);
  updateBombers(dt);
  updatePassing(dt);
  if (state === 'idle' || state === 'done' || state === 'confronted') return;

  updateParticles(dt);

  if (state === 'dying') {
    dyingTimer += dt;
    if (dyingTimer > 2 && !leaderboardShown) {
      leaderboardShown = true;
      state = 'done';
      showLeaderboard();
    }
    return;
  }

  // state === 'playing'
  const finishPx = FINISH_NM * NM_PX;
  const atFinish = distance >= finishPx;

  if (atFinish) {
    // approach to the finish — engines all stop
    scrollSpeed *= Math.pow(0.4, dt);
    if (scrollSpeed < 2) scrollSpeed = 0;
  } else {
    scrollSpeed = Math.min(scrollSpeed + SCROLL_ACCEL * dt, MAX_SCROLL);
  }
  scrollY  += scrollSpeed * dt;
  distance  = Math.min(distance + scrollSpeed * dt, finishPx);

  // obstacle spawning — only while still under way
  if (!atFinish) {
    spawnInterval = Math.max(0.65, 1.8 - (distance / NM_PX) * 0.012);
    spawnClock += dt;
    if (spawnClock >= spawnInterval) {
      spawnClock = 0;
      spawnObs();
      if (distance > 30 * NM_PX && Math.random() < 0.32) spawnObs();
      if (distance > 70 * NM_PX && Math.random() < 0.22) spawnObs();
    }
  }

  for (const o of obstacles) updateObs(o, dt);
  obstacles = obstacles.filter(o => !o.dead && o.y < LH + 60);

  // update bullets
  for (const b of bullets) {
    b.age += dt;
    b.x   += b.vx * dt;
    b.y   += b.vy * dt;
  }

  // bullet collisions with the tanker
  if (invulTimer <= 0) {
    for (const b of bullets) {
      if (b.age >= b.life) continue;
      if (hullDist(b.x, b.y) < (b.r ?? 5) + HULL_R) {
        damage = Math.min(100, damage + DMG.rpg);
        hitFlash = 1;
        boom(b.x, b.y, '#ffaa44', 14);
        boom(player.x, player.y, '#ff6622', 8);
        b.age = b.life;                             // consume the round
        if (damage >= 100) {
          state = 'dying';
          dyingTimer = 0;
          leaderboardShown = false;
          deathReason = tankerName.toUpperCase() + ' WAS SUNK BY AN RPG ROUND IN THE STRAIT.';
        } else {
          invulTimer = HIT_INVUL;
        }
        break;
      }
    }
  }

  bullets = bullets.filter(b => b.age < b.life
                                && b.x > -30 && b.x < LW + 30
                                && b.y > -30 && b.y < LH + 30);

  // post-hit invulnerability + flash decay
  if (invulTimer > 0) invulTimer = Math.max(0, invulTimer - dt);
  if (hitFlash  > 0) hitFlash  = Math.max(0, hitFlash  - dt * 2);

  // player movement
  const goL = keys.left  || touch.left  || btns.left;
  const goR = keys.right || touch.right || btns.right;
  if (goL) player.x -= PLAYER_SPD * dt;
  if (goR) player.x += PLAYER_SPD * dt;
  const plb = shoreLeftAt(PLAYER_Y)  + TW / 2 + 2;
  const prb = shoreRightAt(PLAYER_Y) - TW / 2 - 2;
  player.x = Math.max(plb, Math.min(prb, player.x));

  // boss spawn
  if (!bossSpawned && distance / NM_PX >= bossTarget) {
    bossSpawned = true;
    boss = { x: LW / 2, y: -110, vy: 70, timer: 0 };
  }

  // boss approach + perfect x-tracking (no escape)
  if (boss) {
    boss.timer += dt;

    // x always tracks player smoothly — no matter where they go
    const dx = player.x - boss.x;
    boss.x += dx * 3.2 * dt;
    const blb = shoreLeftAt(boss.y)  + 32;
    const brb = shoreRightAt(boss.y) - 32;
    boss.x = Math.max(blb, Math.min(brb, boss.x));

    // descend until locked menacingly above the tanker bow
    const lockY = player.y - 200;
    if (boss.y < lockY) {
      boss.vy = Math.min(boss.vy + 22 * dt, 200);
      boss.y += boss.vy * dt;
      if (boss.y >= lockY) {
        boss.y = lockY;
        boss.x = player.x;
        state = 'confronted';
        leaderboardShown = false;
        deathReason = tankerName.toUpperCase() + ' WAS BOARDED BY USS MANIFEST DESTINY (GOLDEN EDITION).';
        showBossDialog();
      }
    }
  }

  // obstacle collisions — apply damage, mines are fatal, others chip away
  if (invulTimer <= 0) {
    for (const o of obstacles) {
      if (o.dead) continue;
      if (!hits(o)) continue;

      const dmg = DMG[o.type.id] ?? 10;
      damage = Math.min(100, damage + dmg);
      o.dead = true;
      hitFlash = 1;

      if (o.type.id === 'mine') {
        boom(o.x, o.y, '#ff7700', 24);
        boom(player.x, player.y, '#ffaa00', 20);
        boom(player.x, player.y, '#cc2200', 14);
      } else {
        boom(o.x,        o.y,        o.type.color, 12);
        boom(player.x,   player.y,   '#ff8800',     8);
      }

      if (damage >= 100) {
        state = 'dying';
        dyingTimer = 0;
        leaderboardShown = false;
        deathReason = (o.type.id === 'mine')
          ? tankerName.toUpperCase() + ' STRUCK A NAVAL MINE AND BROKE APART IN THE STRAIT.'
          : tankerName.toUpperCase() + ' WAS LOST TO ENEMY ACTION IN THE STRAIT.';
      } else {
        invulTimer = HIT_INVUL;
      }
      break;
    }
  }
}

// ── Iranian rocket barrage ───────────────────────────────────────
// Pure scenery: rockets launch from the Iranian shore, arc over the strait
// and slam into the far side. They never touch the tanker.
// Positions are kept in world y (screen y - scrollY) so they ride the scroll.
let rockets     = [];
let smoke       = [];
let craters     = [];
let rocketClock = 3;
let shake       = 0;

function launchSalvo(n) {
  const dur  = 1.6 + Math.random() * 0.7;
  // pick a launch site near the top half and a landing spot that will still
  // be on screen once the scroll has carried it down during the flight
  const sy0  = 70 + Math.random() * LH * 0.35;
  const syL  = sy0 + 40 + Math.random() * LH * 0.35;
  const wy0  = sy0 - scrollY;
  const wyL  = syL - scrollY - scrollSpeed * dur;
  const rx   = shoreRightAt(sy0);
  const x0   = rx + 8 + Math.random() * Math.max(2, LW - rx - 16);
  for (let i = 0; i < n; i++) {
    const wy1 = wyL + (i - (n - 1) / 2) * 22;
    const lx  = shoreLeftAt(wy1 + scrollY);
    rockets.push({
      x0, wy0,
      x1: 5 + Math.random() * Math.max(2, lx - 12),
      wy1,
      t: -i * 0.22,              // stagger salvo launches
      dur: dur + i * 0.05,
      peak: 80 + Math.random() * 70,
      puffClock: 0,
    });
  }
}

function rocketAt(r, k) {
  return {
    x:  r.x0  + (r.x1  - r.x0)  * k,
    wy: r.wy0 + (r.wy1 - r.wy0) * k,
    h:  Math.sin(Math.PI * k) * r.peak,      // height above the ground track
  };
}

function updateRockets(dt) {
  const nm = distance / NM_PX;
  if (state === 'playing' && nm > 3 && nm < FINISH_NM - 4) {
    rocketClock -= dt;
    if (rocketClock <= 0) {
      rocketClock = Math.max(0.9, 3.4 - nm * 0.025) * (0.6 + Math.random() * 0.8);
      launchSalvo(Math.random() < 0.25 + nm * 0.005 ? 3 : 1);
    }
  }

  for (const r of rockets) {
    r.t += dt;
    if (r.t < 0) continue;
    if (!r.lit) {
      r.lit = true;
      boom(r.x0, r.wy0 + scrollY, '#ffd27a', 7);           // launch flash
      for (let i = 0; i < 4; i++) {
        smoke.push({ x: r.x0 + (Math.random() - 0.5) * 8, wy: r.wy0 + (Math.random() - 0.5) * 8,
                     age: 0, life: 1.6, r: 3 });
      }
    }
    const k = Math.min(1, r.t / r.dur);
    const p = rocketAt(r, k);
    r.puffClock -= dt;
    if (r.puffClock <= 0 && k < 1) {
      r.puffClock = 0.035;
      smoke.push({ x: p.x, wy: p.wy - p.h, age: 0, life: 1.1, r: 1.6 });
    }
    if (k >= 1) {
      r.done = true;
      const sy = r.wy1 + scrollY;
      boom(r.x1, sy, '#ff7a1a', 16);
      boom(r.x1, sy, '#ffd27a', 8);
      craters.push({ x: r.x1, wy: r.wy1, age: 0 });
      shake = Math.min(1, shake + 0.35);
    }
  }
  rockets = rockets.filter(r => !r.done);

  for (const s of smoke)   s.age += dt;
  for (const c of craters) c.age += dt;
  smoke   = smoke.filter(s => s.age < s.life);
  craters = craters.filter(c => c.age < 6 && c.wy + scrollY < LH + 20);
  shake   = Math.max(0, shake - dt * 2.5);
}

// burning impact craters — drawn on the land layer
function drawCraters() {
  const T = performance.now() / 1000;
  for (const c of craters) {
    const x = c.x, y = c.wy + scrollY;
    const fade = 1 - Math.max(0, (c.age - 4) / 2);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(30,15,5,0.75)';
    ctx.beginPath(); ctx.ellipse(x, y, 7, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    if (c.age < 3.5) {
      for (let i = 0; i < 3; i++) {
        const fl = 0.6 + 0.4 * Math.sin(T * 18 + i * 2 + c.x);
        ctx.fillStyle = i ? '#ffb030' : '#ff5a10';
        ctx.beginPath();
        ctx.arc(x + (i - 1) * 2.5, y - fl * 2, 2.2 * fl * (1 - c.age / 3.5) + 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawRockets() {
  const T = performance.now() / 1000;
  // smoke trails
  for (const s of smoke) {
    const ph = s.age / s.life;
    ctx.fillStyle = `rgba(200,200,200,${0.4 * (1 - ph)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.wy + scrollY, s.r + ph * 5, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const r of rockets) {
    if (r.t < 0) continue;
    const k  = Math.min(1, r.t / r.dur);
    const p  = rocketAt(r, k);
    const q  = rocketAt(r, Math.min(1, k + 0.02));
    const gy = p.wy + scrollY;           // ground track (shadow)
    const ay = gy - p.h;                 // where it is in the air
    const lift = p.h / r.peak;

    // shadow on the ground/water
    ctx.fillStyle = `rgba(0,0,0,${0.3 - lift * 0.15})`;
    ctx.beginPath(); ctx.ellipse(p.x, gy, 3 + lift * 2, 1.6 + lift, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(p.x, ay);
    ctx.rotate(Math.atan2((q.wy - q.h) - (p.wy - p.h), q.x - p.x) + Math.PI / 2);
    const sc = 1 + lift * 0.6;           // closer to the camera at the top of the arc
    ctx.scale(sc, sc);

    // exhaust flame + glow
    const fl = 4 + Math.sin(T * 40 + r.x0) * 1.5;
    ctx.fillStyle = 'rgba(255,170,40,0.35)';
    ctx.beginPath(); ctx.arc(0, 6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcf4a';
    ctx.beginPath(); ctx.moveTo(-1.6, 4); ctx.lineTo(0, 4 + fl * 1.8); ctx.lineTo(1.6, 4); ctx.closePath(); ctx.fill();
    // body, fins, nose
    ctx.fillStyle = '#d9d4c7';
    ctx.fillRect(-1.6, -5, 3.2, 9.5);
    ctx.fillStyle = '#6b7a3a';
    ctx.beginPath(); ctx.moveTo(-1.6, 2); ctx.lineTo(-3.6, 5); ctx.lineTo(-1.6, 5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 1.6, 2); ctx.lineTo( 3.6, 5); ctx.lineTo( 1.6, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c0281c';
    ctx.beginPath(); ctx.moveTo(-1.6, -5); ctx.lineTo(0, -9); ctx.lineTo(1.6, -5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ── US stealth bombers ───────────────────────────────────────────
// Also scenery: B-2s sweep left to right and bomb the Iranian shore.
let bombers     = [];
let bombs       = [];
let bomberClock = 8;
const BOMB_FALL = 0.75;

function launchBombers() {
  // Pick a target on the Iranian shore, a random heading (anything from
  // diving down-right to climbing up-right), and back-track to where the
  // plane enters on the left so its path runs straight over the target.
  const ty  = 110 + Math.random() * (LH - 260);
  const rx  = shoreRightAt(ty);
  const tx  = rx + 8 + Math.random() * Math.max(2, LW - rx - 14);
  const ang = (Math.random() * 2 - 1) * 0.7;           // about ±40°
  const spd = 160 + Math.random() * 50;
  const dx  = Math.cos(ang), dy = Math.sin(ang);
  const back = (tx + 70) / dx;                          // distance back to x = -70
  const n  = Math.random() < 0.4 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    // wingman sits behind and off to the side
    const offA = -i * 50, offP = i * 40;
    const plane = {
      x: tx - dx * back + dx * offA - dy * offP,
      y: ty - dy * back + dy * offA + dx * offP,
      vx: dx * spd, vy: dy * spd, ang, targets: [],
    };
    // 2-3 bombs walked along the track around the aim point
    const k = 2 + (Math.random() < 0.5 ? 1 : 0);
    for (let j = 0; j < k; j++) {
      const along = (j - (k - 1) / 2) * 12;
      const aimX = tx + dx * along - dy * offP, aimY = ty + dy * along + dx * offP;
      // bombs keep 55% of the plane's speed while they fall, so release early
      const lead = spd * 0.55 * BOMB_FALL;
      plane.targets.push({ rx: aimX - dx * lead, ry: aimY - dy * lead });
    }
    bombers.push(plane);
  }
}

function updateBombers(dt) {
  const nm = distance / NM_PX;
  if (state === 'playing' && nm > 8 && nm < FINISH_NM - 4) {
    bomberClock -= dt;
    if (bomberClock <= 0) {
      bomberClock = 5 + Math.random() * 5;
      launchBombers();
    }
  }
  for (const p of bombers) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    for (const t of p.targets) {
      // release once the plane has flown past the release point along its heading
      if (!t.dropped && (p.x - t.rx) * p.vx + (p.y - t.ry) * p.vy >= 0) {
        t.dropped = true;
        bombs.push({ x: p.x, y: p.y, vx: p.vx * 0.55, vy: p.vy * 0.55, t: 0 });
      }
    }
  }
  bombers = bombers.filter(p => p.x < LW + 90 && p.y > -140 && p.y < LH + 140);

  for (const b of bombs) {
    b.t += dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.t >= BOMB_FALL) {
      b.done = true;
      boom(b.x, b.y, '#ffb347', 18);
      boom(b.x, b.y, '#ff5a1a', 10);
      craters.push({ x: b.x, wy: b.y - scrollY, age: 0 });
      shake = Math.min(1, shake + 0.3);
    }
  }
  bombs = bombs.filter(b => !b.done);
}

function drawB2(scale, fill, stroke) {
  // top-down flying wing, nose pointing +x
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-8, -32); ctx.lineTo(-14, -25); ctx.lineTo(-6, -16); ctx.lineTo(-13, -8);
  ctx.lineTo(-9, 0);
  ctx.lineTo(-13, 8);  ctx.lineTo(-6, 16);  ctx.lineTo(-14, 25); ctx.lineTo(-8, 32);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1 / scale; ctx.stroke(); }
}

function drawBombers() {
  // falling bombs shrink as they drop away from the camera
  for (const b of bombs) {
    const k = b.t / BOMB_FALL;
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 3 * (1 - k * 0.6), 1.6 * (1 - k * 0.6), 0, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of bombers) {
    // shadow far below on the water
    ctx.save();
    ctx.translate(p.x + 22, p.y + 30);
    ctx.rotate(p.ang);
    ctx.scale(0.7, 0.7);
    drawB2(0.7, 'rgba(0,0,0,0.22)');
    ctx.restore();

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.ang);
    drawB2(1, '#4a525e', '#16191e');
    // centre-body hump, cockpit, intakes
    ctx.fillStyle = '#5a636f';
    ctx.beginPath(); ctx.ellipse(1, 0, 10, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0d1a26';
    ctx.fillRect(8, -2.5, 2.2, 1.8); ctx.fillRect(8, 0.7, 2.2, 1.8);
    ctx.fillStyle = '#353b44';
    for (const sy of [-8, 8]) { ctx.beginPath(); ctx.ellipse(-1, sy, 3.5, 1.6, 0, 0, Math.PI * 2); ctx.fill(); }
    // blinking nav lights on the wingtips
    if (Math.sin(performance.now() / 160) > 0.3) {
      ctx.fillStyle = '#ff3030'; ctx.beginPath(); ctx.arc(-8, -31, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#30ff60'; ctx.beginPath(); ctx.arc(-8,  31, 1.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

// "NOW PASSING" banner when the southern shore changes country
let passing = { name: '', flag: '', t: 99 };

function updatePassing(dt) {
  passing.t += dt;
  if (state !== 'playing') return;
  const c = countryAtNm(distance / NM_PX);
  if (c.name !== passing.name) passing = { name: c.name, flag: c.flag, t: 0 };
}

function drawPassing() {
  const D = 3.2;                                    // seconds on screen
  if (passing.t > D) return;
  const t = passing.t;
  const a = Math.min(1, t * 3) * Math.min(1, (D - t) * 2);
  const slide = (1 - Math.min(1, t * 4)) * -24;    // drops in from above
  const cx = LW / 2, cy = 190 + slide;
  const words = passing.name.split(' ');
  // long names wrap onto two lines
  const lines = passing.name.length > 9 && words.length > 1 ? words : [passing.name];
  const size = lines.length > 1 ? 36 : 44;

  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';

  // dim band behind the text so it reads over anything
  const bandH = 64 + lines.length * size;
  const bg = ctx.createLinearGradient(0, cy - bandH / 2, 0, cy + bandH / 2);
  bg.addColorStop(0, 'rgba(0,10,20,0)');
  bg.addColorStop(0.25, 'rgba(0,10,20,0.6)');
  bg.addColorStop(0.75, 'rgba(0,10,20,0.6)');
  bg.addColorStop(1, 'rgba(0,10,20,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, cy - bandH / 2, LW, bandH);

  let y = cy - (lines.length * size) / 2 - 8;
  ctx.font = 'bold 14px ' + MONO;
  ctx.fillStyle = '#7fd3ff';
  ctx.fillText('▸ NOW PASSING ◂', cx, y - 6);

  const fl = flagSprite(passing.flag);
  const fh = 26, fw = fl.w * (fh / fl.h);
  y += 4;
  ctx.font = `800 ${size}px ` + MONO;
  lines.forEach((line, i) => {
    const ly = y + size / 2 + i * size;
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#000';
    ctx.strokeText(line, cx + 3, ly + 3);          // hard drop shadow
    ctx.strokeStyle = '#06121c';
    ctx.strokeText(line, cx, ly);
    ctx.fillStyle = '#fff2d8';
    ctx.fillText(line, cx, ly);
  });
  ctx.drawImage(fl.img, cx - fw / 2, y + lines.length * size + 6, fw, fh);
  ctx.restore();
}

// ── draw ─────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, LW, LH);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 4, (Math.random() - 0.5) * shake * 4);
  drawWater();
  drawShores();

  for (const o of obstacles) {
    switch (o.type.id) {
      case 'mine':    drawMine(o.x, o.y, o.r, o.age); break;
      case 'boat':    drawSpeedboat(o.x, o.y, o.r, o.age); break;
      case 'drone':   drawDrone(o.x, o.y, o.r, o.age); break;
      case 'missile': drawMissile(o.x, o.y, o.r, o.vy + scrollSpeed, o.vx); break;
    }
    // label fades in briefly
    if (o.age < 1.2) {
      const la = Math.min(o.age * 3, 1) * (1 - Math.max(0, (o.age - 0.8) / 0.4));
      ctx.save();
      ctx.globalAlpha = la;
      ctx.fillStyle = o.type.color;
      ctx.font = '8px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(o.type.label, o.x, o.y - o.r - 5);
      ctx.restore();
    }
  }

  if (boss) drawBoss(boss);
  drawBullets();
  drawParticles();

  // tanker — fades on death, flickers when invulnerable, red flash on hit
  const dead = state === 'dying';
  let tankerAlpha = dead ? 0.25 : 1;
  if (!dead && invulTimer > 0) {
    // flicker every ~80ms
    tankerAlpha = (Math.floor(invulTimer * 12) % 2 === 0) ? 1 : 0.35;
  }
  drawTanker(player.x, player.y, FLAGS[selectedFlag].emoji, tankerAlpha);
  drawRockets();   // airborne, so above the ships
  drawBombers();
  ctx.restore();   // end screen shake

  // hit flash overlay
  if (hitFlash > 0) {
    ctx.save();
    ctx.globalAlpha = hitFlash * 0.45;
    ctx.fillStyle = '#cc1100';
    ctx.fillRect(0, 0, LW, LH);
    ctx.restore();
  }

  if (state !== 'idle' && state !== 'done') drawHUD();

  drawPassing();

  // boss approach warning
  if (boss && state === 'playing') {
    const bt = boss.timer;
    if (Math.sin(bt * 9) > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, bt * 1.6);
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 12px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚠  U.S. NAVY VESSEL APPROACHING  ⚠', LW / 2, 56);
      ctx.restore();
    }
  }
}

// ── boss confrontation dialog ────────────────────────────────────
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function showBossDialog() {
  const msg = document.getElementById('dialog-msg');
  msg.innerHTML =
    `<b>M/V ${escapeHtml(tankerName.toUpperCase())},</b><br><br>` +
    `You are in violation of traversing the Strait of America.<br><br>` +
    `Prepare to be boarded.`;
  document.getElementById('dialog-panel').classList.remove('hidden');
}

function closeBossDialog() {
  document.getElementById('dialog-panel').classList.add('hidden');
  if (state === 'confronted' && !leaderboardShown) {
    leaderboardShown = true;
    state = 'done';
    showLeaderboard();
  }
}

document.getElementById('dialog-ok').addEventListener('click', closeBossDialog);

// ── leaderboard ──────────────────────────────────────────────────
const LB_KEY = 'hormuz_lb_v1';

function getLB() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch { return []; }
}

function saveLB(entry) {
  let lb = getLB();
  lb.push(entry);
  // primary: NM desc; tiebreak: damage asc (less damage = higher rank)
  lb.sort((a, b) => {
    if (b.nm !== a.nm) return b.nm - a.nm;
    return (a.damage ?? 100) - (b.damage ?? 100);
  });
  lb = lb.slice(0, 10);
  localStorage.setItem(LB_KEY, JSON.stringify(lb));
  return lb;
}

function showLeaderboard() {
  const nm = Math.floor(distance / NM_PX);
  const dmg = Math.floor(damage);
  const entry = {
    name: tankerName,
    flag: FLAGS[selectedFlag].emoji,
    nm,
    damage: dmg,
    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
  };
  const lb = saveLB(entry);

  document.getElementById('death-msg').textContent = deathReason;
  document.getElementById('run-nm').textContent = nm;
  document.getElementById('run-dmg').textContent = dmg;

  const tbody = document.getElementById('lb-body');
  tbody.innerHTML = '';
  lb.forEach((e, i) => {
    const tr = document.createElement('tr');
    if (e.name === tankerName && e.nm === nm && (e.damage ?? -1) === dmg) tr.className = 'you';
    const d = e.damage ?? 100;
    tr.innerHTML =
      `<td>${i + 1}</td>` +
      `<td>${e.flag} ${escapeHtml(e.name)}</td>` +
      `<td>${e.nm}</td>` +
      `<td>${d}%</td>` +
      `<td>${e.date}</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('lb-panel').classList.remove('hidden');
}

// ── game init ────────────────────────────────────────────────────
function startGame() {
  state        = 'playing';
  scrollSpeed  = BASE_SCROLL;
  scrollY      = 0;
  distance     = 0;
  obstacles    = [];
  particles    = [];
  spawnClock   = 0;
  spawnInterval = 1.8;
  player       = { x: LW / 2, y: PLAYER_Y };
  bullets      = [];
  rockets      = [];
  smoke        = [];
  craters      = [];
  rocketClock  = 3;
  bombers      = [];
  bombs        = [];
  bomberClock  = 8;
  passing      = { name: '', flag: '', t: 99 };
  shake        = 0;
  boss         = null;
  bossSpawned  = false;
  bossTarget   = FINISH_NM;
  dyingTimer   = 0;
  eatenTimer   = 0;
  damage       = 0;
  invulTimer   = 0;
  hitFlash     = 0;
  leaderboardShown = false;
  deathReason  = '';

  document.getElementById('start-panel').classList.add('hidden');
  document.getElementById('lb-panel').classList.add('hidden');
  document.getElementById('dialog-panel').classList.add('hidden');
}

// ── UI ───────────────────────────────────────────────────────────
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches)
              || 'ontouchstart' in window;
const touchControls = document.getElementById('touch-controls');

if (IS_TOUCH) {
  document.getElementById('controls-hint').textContent =
    'Steer with the ◀ ▶ buttons at the bottom, or tap either side of the screen.';
  for (const side of ['left', 'right']) {
    const b = document.getElementById('steer-' + side);
    const press   = e => { e.preventDefault(); btns[side] = true;  b.classList.add('pressed'); };
    const release = e => { e.preventDefault(); btns[side] = false; b.classList.remove('pressed'); };
    b.addEventListener('pointerdown', e => { b.setPointerCapture?.(e.pointerId); press(e); });
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('lostpointercapture', release);
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
}

// only show the buttons while actually sailing
let controlsShown = false;
function syncTouchControls() {
  const want = IS_TOUCH && (state === 'playing' || state === 'dying');
  if (want === controlsShown) return;
  controlsShown = want;
  touchControls.classList.toggle('hidden', !want);
  if (!want) {
    btns.left = btns.right = false;
    touchControls.querySelectorAll('.pressed').forEach(b => b.classList.remove('pressed'));
  }
}

document.getElementById('version').textContent = VERSION;

document.getElementById('flag-row').addEventListener('click', e => {
  const btn = e.target.closest('[data-idx]');
  if (!btn) return;
  selectedFlag = parseInt(btn.dataset.idx);
  document.querySelectorAll('.flag-opt').forEach(b => {
    b.classList.toggle('sel', b === btn);
    b.setAttribute('aria-checked', b === btn ? 'true' : 'false');
  });
});

document.getElementById('deploy-btn').addEventListener('click', () => {
  const v = document.getElementById('tanker-name').value.trim();
  tankerName = v || 'MV CRUDE JUSTICE';
  startGame();
});

document.getElementById('tanker-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('deploy-btn').click();
});

document.getElementById('replay-btn').addEventListener('click', () => {
  document.getElementById('lb-panel').classList.add('hidden');
  document.getElementById('start-panel').classList.remove('hidden');
  state = 'idle';
});

// ── loop ─────────────────────────────────────────────────────────
let lastTs = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  update(dt);
  draw();
  syncTouchControls();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
